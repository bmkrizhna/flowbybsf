if(VW.vIdx>=vs.length) VW.vIdx=vs.length-1;
const multiVideo=new Set(vs.map(v=>v.video)).size>1;
const optLabel=v=>(multiVideo&&v.video?v.video+' · ':'')+v.label+(v.title?' · '+v.title:'');
sec.innerHTML=`<h2 class="vw-h2">Review &amp; Feedback</h2><div class="vw-box">
${vs.length>1?`<select class="vw-vsel" aria-label="Version" onchange="vwSelectVersion(Number(this.value))">${vs.map((v,i)=>`<option value="${i}" ${i===VW.vIdx?'selected':''}>${esc(optLabel(v))}</option>`).join('')}</select>`:''}
<div class="vw-vhead"><div class="vw-vtitle" id="vwVTitle"></div><span id="vwVStat"></span></div>
<div class="vw-player" id="vwPlayer"></div>
<div class="vw-fb" id="vwFb"></div>
${isClient?'<div class="vw-actions" id="vwActions"></div>':''}</div>`;
vwRenderHead();
vwMountPlayer();
vwRenderFeedback();
vwRenderActions();
}
function vwRenderHead(){
const ver=vwCurrentVersion(); if(!ver) return;
const t=document.getElementById('vwVTitle'), s=document.getElementById('vwVStat');
if(t) t.textContent=ver.label+(ver.title?' · '+ver.title:'');
if(s){ const st=vwVerStatus(ver); s.innerHTML=`<span class="dl-pill ${dlSlug(st)}">${esc(st)}</span>`; }
}
function vwVerFeedback(ver){
const sn=VW.data.snapshot, reps=sn.replies||{};
const cl=(VW.feedback||[]).filter(f=>(f.version_label||'')===ver.id).map(f=>({id:f.id,author:f.author,seconds:f.seconds,timecode:f.timecode||'',message:f.message,resolved:!!f.resolved,ts:Date.parse(f.created_at),replies:reps[f.id]||[]}));
const ed=(ver.notes||[]).map(n=>({id:n.id,author:'Editor',seconds:n.seconds,timecode:n.timecode||'',message:n.message,resolved:!!n.resolved,ts:n.ts,replies:[]}));
return cl.concat(ed).sort((a,b)=>(a.seconds==null)-(b.seconds==null) || (a.seconds||0)-(b.seconds||0) || a.ts-b.ts);
}
function vwRenderActions(){
const el=document.getElementById('vwActions'), ver=vwCurrentVersion();
vwRenderHead();
if(!el || !ver) return;
const st=vwVerStatus(ver), approved=st==='Approved', hasFb=vwVerFeedback(ver).some(f=>f.author!=='Editor');
const armed=VW.armed===ver.id;
el.innerHTML=`<button type="button" class="vw-act send" id="vwSend" ${(approved||!hasFb)?'disabled':''} onclick="vwSetStatus('Needs Changes')">${VW_ICON_CHECK}<span>${st==='Needs Changes'?'Sent for Review':'Send for Review'}</span></button>
<button type="button" class="vw-act approve ${approved?'done':''}" id="vwApprove" ${approved?'disabled':''} onclick="vwSetStatus('Approved')">${approved?VW_ICON_CHECK:''}<span>${approved?'Version Approved':(armed?'Tap again to approve':'Version Approved')}</span></button>
${(!approved&&!hasFb)?'<div class="vw-hint">Add at least one note to send this version for review.</div>':''}<div class="vw-err" id="vwActErr" role="alert"></div>`;
}
async function vwSetStatus(status){
const ver=vwCurrentVersion(); if(!ver) return;
if(status==='Approved' && VW.armed!==ver.id){
VW.armed=ver.id; vwRenderActions();
clearTimeout(VW.armTimer); VW.armTimer=setTimeout(()=>{ if(VW.armed===ver.id){ VW.armed=null; vwRenderActions(); } },4000);
return;
}
VW.armed=null; clearTimeout(VW.armTimer);
const btns=document.querySelectorAll('#vwActions .vw-act'); btns.forEach(b=>b.disabled=true);
try{
const r=await shareRpc('share_status_set',{p_token:VW.token,p_version:ver.id,p_status:status,p_author:VW.name});
if(!r) throw new Error('rejected');
VW.statuses=VW.statuses||{}; VW.statuses[ver.id]={version:ver.id,status:r.status,created_at:r.created_at};
vwRenderActions();
}catch(err){
vwRenderActions();
const e=document.getElementById('vwActErr'); if(e) e.textContent='That didn’t go through. Check your connection and try again.';
}
}
async function vwLoadStatuses(){
try{
const list=await shareRpc('share_status_list',{p_token:VW.token});
const m={}; (list||[]).forEach(x=>{ m[x.version]=x; });
const before=JSON.stringify(VW.statuses||{});
VW.statuses=m;
if(JSON.stringify(m)!==before) vwRenderActions();
}catch(e){}
}
function vwSelectVersion(i){ VW.vIdx=i; VW.armed=null; vwRenderReview(); }
async function vwMountPlayer(){
const box=document.getElementById('vwPlayer');
if(!box) return;
VW.player=null; VW.kind=null;
const ver=vwCurrentVersion();
if(!ver || !ver.link){ box.innerHTML='<div class="vw-empty vw-pad">No video has been linked to this version yet.</div>'; return; }
const v=vwParseVideo(ver.link);
if(!v){ box.innerHTML=`<div class="vw-empty vw-pad">This video can’t be played here. <a href="${esc(ver.link)}" target="_blank" rel="noopener">Open it in a new tab</a>, then type the timecode yourself.</div>`; return; }
if(v.kind==='youtube'){
box.innerHTML=`<iframe id="vwFrame" src="https://www.youtube-nocookie.com/embed/${v.id}?enablejsapi=1&rel=0&playsinline=1&origin=${encodeURIComponent(location.origin)}" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Review video"></iframe>`;
const mine=box.firstChild;
try{ await vwLoadYT(); if(document.getElementById('vwFrame')===mine){ VW.player=new YT.Player('vwFrame',{}); VW.kind='youtube'; } }catch(e){}
} else {
box.innerHTML=`<iframe id="vwFrame" src="https://player.vimeo.com/video/${v.id}?${v.hash?'h='+v.hash+'&':''}dnt=1" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="Review video"></iframe>`;
const mine=box.firstChild;
try{ await vwLoadScript('https://player.vimeo.com/api/player.js'); if(document.getElementById('vwFrame')===mine){ VW.player=new Vimeo.Player(mine); VW.kind='vimeo'; } }catch(e){}
}
}
async function vwNow(){
try{
if(VW.kind==='youtube' && VW.player && typeof VW.player.getCurrentTime==='function') return VW.player.getCurrentTime();
if(VW.kind==='vimeo' && VW.player) return await VW.player.getCurrentTime();
}catch(e){}
return null;
}
async function vwFillNow(force){
const tc=document.getElementById('vwTc');
if(!tc || (!force && tc.dataset.touched==='1')) return;
const t=await vwNow();
if(t!=null){ tc.value=vwFmtTC(t); if(force) tc.dataset.touched='0'; }
}
function vwSeek(sec){
try{
if(VW.kind==='youtube' && VW.player && VW.player.seekTo){ VW.player.seekTo(sec,true); VW.player.playVideo(); }
else if(VW.kind==='vimeo' && VW.player){ VW.player.setCurrentTime(sec).then(()=>VW.player.play()).catch(()=>{}); }
}catch(e){}
const p=document.getElementById('vwPlayer'); if(p) p.scrollIntoView({behavior:'smooth',block:'nearest'});
}
async function vwLoadFeedback(){
try{
const list=await shareRpc('share_feedback_list',{p_token:VW.token});
VW.feedback=list||[];
vwRenderFeedbackList();
}catch(e){}
}
function vwRenderFeedback(){
const box=document.getElementById('vwFb');
if(!box) return;
const isClient=VW.data.audience==='client';
box.innerHTML=`<div class="vw-fb-head"><h3 class="vw-h3">Feedback</h3></div>
${isClient?`<form class="vw-fb-form" id="vwFbForm" autocomplete="off">
<div class="vw-fb-cols"><span>Timecode</span><span>Feedback</span></div>
<div class="vw-fb-inputs">
<div class="vw-tcwrap"><input id="vwTc" class="vw-input vw-tc" inputmode="numeric" placeholder="0:00" maxlength="9" aria-label="Timecode" oninput="this.dataset.touched='1'"><button type="button" class="vw-now" onclick="vwFillNow(true)" title="Use the video’s current time">Now</button></div>
<textarea id="vwMsg" class="vw-input vw-msg" rows="2" maxlength="2000" placeholder="What should change at this moment?" aria-label="Feedback" onfocus="vwFillNow(false)"></textarea>
<button type="submit" class="btn-primary vw-add" id="vwAdd">Add</button></div>
<div class="vw-err" id="vwErr" role="alert"></div></form>`:''}
<div id="vwFbList"></div>`;
if(isClient){
document.getElementById('vwFbForm').addEventListener('submit',vwSubmitFeedback);
document.getElementById('vwMsg').addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey) && e.key==='Enter'){ e.preventDefault(); vwSubmitFeedback(e); } });
}
vwRenderFeedbackList();
}
function vwRenderFeedbackList(){
const el=document.getElementById('vwFbList');
if(!el) return;
const ver=vwCurrentVersion();
const rows=ver?vwVerFeedback(ver):[];
if(!rows.length){ el.innerHTML='<div class="vw-nofb"><b>No Feedback Yet</b>There are no feedback comments for this version.</div>'; vwRenderActions(); return; }
el.innerHTML=rows.map(f=>`<div class="vw-fb-row ${f.resolved?'done':''}"><button type="button" class="vw-tcbtn" ${f.seconds==null?'disabled':''} onclick="vwSeek(${Number(f.seconds)||0})" title="Jump to this moment">${esc(f.timecode||'—')}</button><div class="vw-fb-body"><div class="vw-fb-msg">${esc(f.message)}</div><div class="vw-fb-meta">${esc(f.author)} · ${relTime(f.ts)}${f.resolved?' · <b>Done</b>':''}</div>${f.replies.map(r=>`<div class="vw-reply"><b>Editor</b> · ${relTime(r.ts)}<div>${esc(r.text)}</div></div>`).join('')}</div></div>`).join('');
vwRenderActions();
}
async function vwSubmitFeedback(e){
if(e && e.preventDefault) e.preventDefault();
const tcEl=document.getElementById('vwTc'), msgEl=document.getElementById('vwMsg'), errEl=document.getElementById('vwErr'), btn=document.getElementById('vwAdd');
const msg=msgEl.value.trim();
errEl.textContent='';
if(!msg){ msgEl.focus(); return; }
let secs=vwParseTC(tcEl.value);
if(Number.isNaN(secs)){ errEl.textContent='Use minutes and seconds, like 1:23.'; tcEl.focus(); return; }
const ver=vwCurrentVersion();
btn.disabled=true;
try{
const r=await shareRpc('share_feedback_add',{p_token:VW.token,p_author:VW.name,p_version:ver?ver.id:'',p_timecode:secs==null?'':vwFmtTC(secs),p_seconds:secs,p_message:msg});
VW.feedback.push(r);
msgEl.value=''; tcEl.value=''; tcEl.dataset.touched='0';
vwRenderFeedbackList();
}catch(err){ errEl.textContent='That didn’t send. Check your connection and try again.'; }
btn.disabled=false;
}

/* ---------- INIT ---------- */
async function boot(){
if(window.__VIEW_TOKEN){ vwInit(window.__VIEW_TOKEN); return; }
if(!getRole()){ showLoginGate(); return; }
hideLoginGate();
try{ if(localStorage.getItem('flowSidebarCollapsed')!=='0') document.body.classList.add('sidebar-collapsed'); }catch(e){}
renderOverview();renderCompleted();renderResources();renderSidebarNav();renderRoleBadge();
updateTopbarClock();
setInterval(updateTopbarClock,30000);
loadWeather();
setInterval(loadWeather,900000);
const cloudResult=await loadCloudState();
if(cloudResult==='swapped') reapplyRemoteStateToUI();
subscribeCloudState();
if(hasAnyShare()){ startSharePolling(); pullShares(); syncAllShares(); }
}
boot();
</script>
